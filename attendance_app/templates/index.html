<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy with Tu Harmony | Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Happy with Tu Harmony</h1>
        <h2 id="current-employee-title" style="font-size: 2.5rem; font-weight: 700; margin-bottom: 0.5rem; text-align: center; color: var(--primary); display: none;"></h2>
        <h3 id="current-job-title" style="font-size: 1.5rem; font-weight: 400; margin-bottom: 2rem; text-align: center; color: var(--text-muted); display: none;"></h3>
        
        <div id="login-section" class="setup-section">
            <!-- Quick Selection -->
            <div id="quick-select" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; margin-bottom: 20px;">
                <button class="btn-select-user" data-name="Hieu">Hiếu</button>
                <button class="btn-select-user" data-name="Huong">Hương</button>
                <button class="btn-select-user" data-name="Phuong">Phương</button>
                <button id="add-user-btn" style="background: var(--glass-bg); border: 1px dashed var(--primary); color: var(--primary); padding: 10px 20px; border-radius: 12px; font-size: 1.5rem; cursor: pointer;">+</button>
            </div>

            <div id="name-input-container" style="display: none; width: 100%; flex-direction: column; margin-bottom: 15px;">
                <input type="text" id="name-input" placeholder="Tên nhân viên mới..." style="width: 100%;">
                <div id="name-status" style="font-size: 0.8rem; margin-top: 5px; height: 1.2rem;"></div>
            </div>

            <div style="width: 100%;">
                <input type="text" id="job-input" placeholder="Công việc hiện tại (vd: Dạy học, Bấm huyệt)..." style="width: 100%;">
            </div>

            <button id="confirm-btn" class="btn-start" style="display: none; width: 100%; justify-content: center; margin-top: 15px;">
                Xác nhận <span id="confirm-name-span"></span> <span id="confirm-job-span" style="margin-left: 5px; opacity: 0.7;"></span>
            </button>
        </div>

        <div id="main-app" style="display: none;">
            <div class="timer-card">
                <div id="status-label" class="status-idle">Sẵn sàng</div>
                <div class="display" id="timer-display">00:00:00</div>
                <div class="controls">
                    <button id="start-btn" class="btn-start">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"></path></svg>
                        Bắt đầu
                    </button>
                    <button id="stop-btn" class="btn-stop" disabled>
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z"></path></svg>
                        Kết thúc
                    </button>
                </div>
            </div>

            <div class="history-section">
                <div class="history-header" style="margin-bottom: 10px;">
                    <button id="change-user-btn" style="padding: 8px 16px; font-size: 0.8rem; background: rgba(255,255,255,0.1);">Đổi người / Công việc</button>
                </div>
                
                <!-- UNPAID SECTION -->
                <div class="accordion-item" style="margin-bottom: 15px;">
                    <button class="accordion-header" id="unpaid-header" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(99, 102, 241, 0.1); border: 1px solid var(--primary); padding: 15px; border-radius: 12px; color: white;">
                        <span>🗓️ Chưa thanh toán</span>
                        <span id="unpaid-summary-badge" style="font-weight: 700;">00:00:00</span>
                    </button>
                    
                    <div id="unpaid-content" style="display: none; padding-top: 15px;">
                        <div id="payment-summary" class="timer-card" style="padding: 20px; margin-bottom: 20px; border-style: dashed; background: rgba(16, 185, 129, 0.05);">
                            <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px;">Tổng số giờ từ đợt thanh toán cuối cùng:</div>
                            <div id="total-unpaid-display" style="font-size: 2rem; font-weight: 700; color: var(--success); margin-bottom: 15px;">00:00:00</div>
                            <button id="pay-btn" class="btn-start" style="background: var(--success); margin: 0 auto; width: auto; font-size: 0.9rem;">
                                Xác nhận thanh toán cho <span id="pay-total-span">0 giờ</span>
                            </button>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Ngày</th>
                                    <th>Công việc</th>
                                    <th>Bắt đầu</th>
                                    <th>Kết thúc</th>
                                    <th>Tổng</th>
                                </tr>
                            </thead>
                            <tbody id="unpaid-body"></tbody>
                        </table>
                    </div>
                </div>

                <!-- PAID SECTION -->
                <div class="accordion-item">
                    <button class="accordion-header" id="paid-header" style="width: 100%; display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); padding: 15px; border-radius: 12px; color: var(--text-muted);">
                        <span>✅ Đã thanh toán</span>
                        <span id="paid-count-badge">0 đợt</span>
                    </button>
                    <div id="paid-content" style="display: none; padding-top: 15px;">
                        <table>
                            <thead>
                                <tr>
                                    <th>Khoảng thời gian</th>
                                    <th>Tổng số giờ</th>
                                    <th>Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody id="paid-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
